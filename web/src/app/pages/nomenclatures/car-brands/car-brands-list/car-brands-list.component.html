<div style="margin: 0.5em;">
  <vfm-dummy-table-checkboxes
    [tableHeight]="'77vh'"
    [loading]="loading"
    [haveEdit]="true"
    [allItems]="currentItems"
    [listOfColumns]="allTableColumns"
    (onItemDblClick)="editBrand($event)"
    (onItemClick)="currentItemSelect($event)"
    [titleTemplate]="titleTemplate"
  >
  </vfm-dummy-table-checkboxes>
  <div nz-row nzGutter="10" style="margin: 0.5em;">
    <div nz-col>
      <button nz-button nzType="default" type="button" id="addButton" (click)="editBrand()">
        <span nz-icon nzType="plus-circle" nzTheme="outline"></span>
        <span i18n>Add brand</span>
      </button>
    </div>
    <div nz-col>
      <button
        type="button"
        id="editButton"
        nz-button nzType="default"
        (click)="editBrand(currentItem)"
        [disabled]="!currentItem"
      >
        <i nz-icon nzType="edit" nzTheme="outline"></i>
        <span i18n>Edit</span>
      </button>
    </div>
    <div nz-col>
      <button
        type="button"
        id="deleteButton"
        nz-button
        nzType="default"
        nzDanger
        (click)="removeBrand()"
        [disabled]="!currentItem"
      >
        <i nz-icon nzType="delete" nzTheme="outline"></i>
        <span i18n>Delete</span>
      </button>
    </div>
  </div>
</div>
<ng-template #titleTemplate>

  <div nz-row nzJustify="space-between">
    <div nz-col nzSpan="6" style="font-weight: 900;font-style: italic;align-content: center">
      <span i18n>Brands table</span>
    </div>
    <div nz-col nzSpan="6">
      <vfm-search-input
        (input)="onSearch($event)"
        [delay]="200"
        [minInputLength]="2"
      ></vfm-search-input>
    </div>

  </div>
</ng-template>
